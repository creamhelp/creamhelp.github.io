<title>LeanCam</title>
<script>
(function () {
  var LOCALES = ["en","ko","ja","zh-Hans","zh-Hant","es-ES","de-DE","fr-FR","it","pt-BR","ru"];
  // 브라우저가 주는 태그(ko-KR, zh-TW, pt-PT …)를 우리가 가진 폴더로 접는다.
  function fold(tag) {
    tag = String(tag || "").toLowerCase();
    var base = tag.split("-")[0];
    if (base === "zh") {
      if (/hant|-tw|-hk|-mo/.test(tag)) return "zh-Hant";
      return "zh-Hans";
    }
    var map = { ko:"ko", ja:"ja", es:"es-ES", de:"de-DE", fr:"fr-FR",
                it:"it", pt:"pt-BR", ru:"ru", en:"en" };
    return map[base] || null;
  }
  var wanted = navigator.languages && navigator.languages.length
             ? navigator.languages : [navigator.language];
  var pick = null;
  for (var i = 0; i < wanted.length && !pick; i++) pick = fold(wanted[i]);
  if (LOCALES.indexOf(pick) < 0) pick = "en";
  try { location.replace(pick + "/"); } catch (e) { /* 본문의 언어 목록으로 남는다 */ }
})();
</script>
